stages:
    - build
    - deploy

build:
    stage: build
    tags: [powershell, netCore]
    script: cat file1.txt file2.txt > compiled.txt
    artifacts:
        paths:
            - \*.nuget

nuget-deploy:
    stage: deploy
    tags: [netCore]
    when: manual
    script: cat compiled.txt | gzip > packaged.gz  
