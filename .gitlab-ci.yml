stages:
    - build
    - deploy

build:
    stage: build
    tags: [powershell, netCore]
    script: 
        - .\build.ps1
    artifacts:
        paths:
            - \*\*\\\*.nuget

nuget-deploy:
    stage: deploy
    tags: [powershell, netCore]
    rules:
        - if: '$CI_COMMIT_BRANCH == "master"'
        when: manual
        - when: on_success
    script:
        - dotnet nuget push **/*.nupkg --skip-duplicate -k $env:NUGET_KEY -s $env:NUGET_URL
