stages:
    - build
    - deploy

build:
    stage: build
    tags: [powershell, netCore]
    script: 
        - .\build.ps1
    artifacts:
        paths:
            - \*.nuget

nuget-deploy:
    stage: deploy
    tags: [powershell, netCore]
    when: manual
    script: cat compiled.txt | gzip > packaged.gz  
