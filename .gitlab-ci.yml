stages:
    - build
    - deploy

build:
    stage: build
    tags: [powershell, netCore, msBuild]
    variables:
        CI_DEBUG_TRACE: "true"
    script: 
        - echo $env:CI_JOB_STAGE
        - echo $env:NUGET_KEY
        - echo $env:NUGET_URL
    artifacts:
        paths:
            - \*.nuget

nuget-deploy:
    stage: deploy
    tags: [powershell, netCore]
    when: manual
    script: cat compiled.txt | gzip > packaged.gz  
