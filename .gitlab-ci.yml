stages:
    - build
    - deploy

build:
    stage: build
    tags: [powershell, netCore, vs2019]
    variables:
        - CI_DEBUG_TRACE: "true"
        - MSBUILD: "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
    script: 
        - build.ps1
    artifacts:
        paths:
            - \*.nuget

nuget-deploy:
    stage: deploy
    tags: [powershell, netCore]
    when: manual
    script: cat compiled.txt | gzip > packaged.gz  
